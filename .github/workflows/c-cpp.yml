name: Nyon uellele Nyon nyonOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mtools gdisk util-linux curl

      - name: Build image
        run: make imageall

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nyonOS-image
          path: |
            nyonOS.img
            fat16.img
